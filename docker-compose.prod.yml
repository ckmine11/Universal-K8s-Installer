version: '3.8'

services:
  # Nginx internal proxy (routes /api, /ws to backend, everything else to frontend)
  proxy:
    image: nginx:alpine
    container_name: kubeez-proxy
    ports:
      - "80:80"
      - "8090:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - kubeez-network
    restart: unless-stopped

  # Backend API + WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kubeez-backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KUBEEZ_MODE=${KUBEEZ_MODE:-saas}
      - KUBEEZ_PUBLIC_URL=${KUBEEZ_PUBLIC_URL:-https://k8scluster.space}
      - APP_SECRET=${APP_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://k8scluster.space,http://localhost,http://localhost:8090,http://127.0.0.1,http://127.0.0.1:8090}
      - DOMAIN=${DOMAIN:-k8scluster.space}
      - FRONTEND_URL=${FRONTEND_URL:-https://k8scluster.space}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_UNLIMITED=${STRIPE_PRICE_UNLIMITED}
      # Email: password reset codes + email alerts (empty = no email)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      # KubeEZ AI: the server's own model (the 'ollama' service below); empty URL = off
      - KUBEEZ_AI_URL=${KUBEEZ_AI_URL-http://ollama:11434}
      - KUBEEZ_AI_MODEL=${KUBEEZ_AI_MODEL:-qwen2.5:3b}
    volumes:
      - kubeez-data:/app/data
      - kubeez-logs:/app/logs
    networks:
      - kubeez-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # KubeEZ AI: a local, open-source model (free forever). Private — no public
  # port; only the backend talks to it over the internal network. Hard limits
  # keep KubeEZ fast even when the model is busy. The model (KUBEEZ_AI_MODEL)
  # is downloaded once into the volume by the backend on first start.
  ollama:
    image: ollama/ollama:0.40.5
    container_name: kubeez-ollama
    expose:
      - "11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - kubeez-ai-models:/root/.ollama
    networks:
      - kubeez-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${KUBEEZ_AI_CPUS:-3}'
          memory: ${KUBEEZ_AI_MEMORY:-3500M}

  # Frontend (React SPA served by internal Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: kubeez-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - kubeez-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  kubeez-network:
    driver: bridge

volumes:
  kubeez-data:
    driver: local
  kubeez-ai-models:
    driver: local
  kubeez-logs:
    driver: local
