version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kubeez-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - KUBEEZ_MODE=saas
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost,http://localhost:8090
      - KUBEEZ_AI_URL=${KUBEEZ_AI_URL-http://ollama:11434}
      - KUBEEZ_AI_MODEL=${KUBEEZ_AI_MODEL:-qwen2.5:1.5b}
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    networks:
      - kubeez-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # KubeEZ AI: a local, open-source model (free forever). Private — no public
  # port; only the backend talks to it over the internal network. Hard limits
  # keep KubeEZ fast even when the model is busy. The model (KUBEEZ_AI_MODEL)
  # is downloaded once into the volume by the backend on first start.
  ollama:
    image: ollama/ollama:0.40.5
    container_name: kubeez-ollama
    expose:
      - "11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - kubeez-ai-models:/root/.ollama
    networks:
      - kubeez-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${KUBEEZ_AI_CPUS:-2}'
          memory: ${KUBEEZ_AI_MEMORY:-3000M}

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kubeez-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - kubeez-network
    restart: unless-stopped

networks:
  kubeez-network:
    driver: bridge

volumes:
  backend-logs:
  kubeez-ai-models:
